<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Signature Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface2: #222222;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text-muted: #666;
      --accent: #c9f43c;
      --accent-dark: #a8cc2a;
      --accent-glow: rgba(201,244,60,0.18);
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      width: 100vw; height: 100vh; position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    #app::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% 90%, rgba(201,244,60,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 90% 10%, rgba(201,244,60,0.03) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ---- Branding ---- */
    .brand-wordmark {
      position: fixed;
      top: 18px;
      left: 28px;
      z-index: 100;
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    .brand-wordmark span {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: 42px;
      background: linear-gradient(135deg, var(--accent) 0%, #7af0b0 60%, #40d0f5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      filter: drop-shadow(0 0 18px rgba(201,244,60,0.25));
    }

    .brand-footer {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
      user-select: none;
      pointer-events: none;
      line-height: 1.55;
    }

    .brand-footer .footer-created {
      font-size: 10px;
      font-weight: 400;
      color: #444;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-footer .footer-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13px;
      color: #666;
      letter-spacing: 0.01em;
    }

    .brand-footer .footer-copy {
      font-size: 10px;
      font-weight: 400;
      color: #383838;
      letter-spacing: 0.03em;
    }

    .brand-footer .footer-copy .copy-name {
      font-family: 'Dancing Script', cursive;
      font-weight: 700;
      font-size: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, #7af0b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (max-width: 600px) {
      .brand-wordmark span { font-size: 30px; }
      .brand-wordmark { top: 14px; left: 16px; }
      .brand-footer { bottom: 10px; }
    }

    /* ---- Canvas ---- */
    .canvas-layer {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 292px 40px 40px;
      position: relative; z-index: 1;
    }

    .canvas-wrapper {
      position: relative; width: 100%; max-width: 1000px;
      height: 100%; max-height: 480px; min-height: 320px;
      border-radius: 2px; border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 60px rgba(0,0,0,0.6);
      overflow: hidden; background: #fff;
    }

    #signatureCanvas {
      display: block; width: 100%; height: 100%;
      cursor: none; touch-action: none; background: #fff;
    }

    .canvas-grid {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 24px 24px; z-index: 1;
    }

    .canvas-hint {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 18px; color: #c8c8c8; pointer-events: none;
      user-select: none; transition: opacity 0.5s ease; z-index: 2;
      letter-spacing: 0.02em;
    }

    /* Pen cursor preview */
    #penCursor {
      position: fixed; pointer-events: none; z-index: 999;
      border-radius: 50%; transform: translate(-50%,-50%);
      transition: width 0.1s, height 0.1s, background 0.1s, border-color 0.1s;
      mix-blend-mode: multiply;
    }

    /* ---- Toolbar ---- */
    .floating-toolbar {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px; padding: 5px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 100;
    }

    .toolbar-divider { width: 1px; height: 22px; background: var(--border); margin: 0 3px; }

    .tool-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px;
      border: none; border-radius: 999px; background: transparent;
      color: var(--text); font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background 0.15s, opacity 0.15s; outline: none; user-select: none;
    }
    .tool-btn:hover:not(:disabled) { background: var(--surface2); }
    .tool-btn:active:not(:disabled) { transform: scale(0.95); }
    .tool-btn:disabled { cursor: not-allowed; }
    .tool-btn svg { flex-shrink: 0; }

    .tool-btn--primary { background: var(--accent); color: #0f0f0f; font-weight: 600; }
    .tool-btn--primary:hover:not(:disabled) { background: var(--accent-dark); }

    /* ---- Panel ---- */
    .properties-panel {
      position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
      width: 264px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      z-index: 50; overflow: hidden;
    }

    .panel-accent-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, #7af0b0 50%, #40d0f5 100%);
    }

    .panel-header { padding: 16px 20px 8px; }
    .panel-header h2 {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 21px; font-weight: 400; color: var(--text); letter-spacing: -0.3px;
    }

    .panel-section { padding: 9px 20px; }

    .section-label {
      display: block; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-muted); margin-bottom: 8px;
    }

    .panel-divider { height: 1px; background: var(--border); margin: 3px 16px; }

    .panel-footer {
      padding: 10px 20px 14px; border-top: 1px solid var(--border);
    }

    .signature-info {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 500; color: #555;
    }
    .info-divider { color: #383838; }

    /* ---- Color Grid ---- */
    .color-grid { display: flex; flex-wrap: wrap; gap: 7px; }

    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; outline: none;
    }
    .color-swatch:hover { transform: scale(1.12); }
    .color-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .color-swatch--custom {
      background: var(--surface2); display: flex;
      align-items: center; justify-content: center; color: #888;
    }

    /* ---- Sliders ---- */
    .slider-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 7px;
    }
    .slider-row:last-child { margin-bottom: 0; }

    .slider-label-col { width: 76px; flex-shrink: 0; }
    .slider-label-col .section-label { margin-bottom: 0; line-height: 1; }

    .slider-track-col { flex: 1; }

    .slider-value {
      width: 36px; text-align: right; flex-shrink: 0;
      font-size: 11px; font-weight: 600; color: var(--text);
    }

    .slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px; border-radius: 2px;
      background: var(--surface2); outline: none; cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      border: 2px solid var(--surface); box-shadow: 0 0 0 1px #444;
      transition: transform 0.15s;
    }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .slider::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--surface);
    }

    /* ---- Background ---- */
    .bg-options { display: flex; gap: 7px; }
    .bg-option {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 8px 4px; border: 1.5px solid var(--border); border-radius: 6px;
      background: transparent; color: #666; font-family: inherit;
      font-size: 10px; font-weight: 500; cursor: pointer;
      transition: border-color 0.15s, color 0.15s; outline: none;
    }
    .bg-option:hover { border-color: #444; }
    .bg-option.active { border-color: var(--accent); color: var(--text); }
    .bg-preview { width: 26px; height: 26px; border-radius: 3px; border: 1px solid #3a3a3a; }

    /* ---- Toggle rows ---- */
    .toggle-rows { display: flex; flex-direction: column; gap: 8px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-row .section-label { margin-bottom: 0; }

    .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: var(--surface2);
      border-radius: 10px; transition: background 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; background: #888; border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: rgba(201,244,60,0.15); }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px); background: var(--accent);
    }

    /* ---- Mobile toggle ---- */
    .panel-toggle {
      display: none; position: fixed; bottom: 20px; right: 20px;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer; align-items: center; justify-content: center;
      z-index: 100; transition: background 0.15s, transform 0.2s;
    }
    .panel-toggle:hover { background: var(--surface2); }
    .panel-toggle.toggle-active { background: var(--accent); color: #0f0f0f; transform: rotate(45deg); }

    /* ---- Toast ---- */
    .toast-container {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      z-index: 200; pointer-events: none;
    }
    .toast-notification {
      padding: 10px 22px; border-radius: 999px; font-size: 13px; font-weight: 500;
      color: var(--text); background: var(--surface2); border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); animation: toast-in 0.3s ease-out forwards;
    }
    .toast-notification.toast-success { background: rgba(22,163,74,0.9); border-color: #16a34a; color:#fff; }
    .toast-notification.toast-error { background: rgba(220,38,38,0.9); border-color:#dc2626; color:#fff; }
    .toast-notification.fade-out { animation: toast-out 0.3s ease-in forwards; }

    @keyframes toast-in { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toast-out { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-8px)} }

    /* ---- Mobile ---- */
    @media (max-width: 900px) {
      .canvas-layer { padding: 86px 20px 96px; }
      .canvas-wrapper { max-height: 58vh; }
      .properties-panel {
        position: fixed; top: auto; bottom: 0; right: 0; left: 0;
        transform: translateY(100%); width: 100%; max-height: 60vh;
        border-radius: 14px 14px 0 0; border-bottom: none;
        box-shadow: 0 -4px 32px rgba(0,0,0,0.5);
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        overflow-y: auto; z-index: 80;
      }
      .properties-panel.panel-open { transform: translateY(0); }
      .panel-toggle { display: flex; }
      .panel-footer { padding-bottom: 28px; }
    }
    @media (max-width: 600px) {
      .floating-toolbar { top: 12px; padding: 4px; }
      .tool-btn { padding: 6px 10px; font-size: 12px; }
      .tool-btn span { display: none; }
      .toolbar-divider { margin: 0 2px; }
      .canvas-layer { padding: 76px 12px 86px; }
      .canvas-wrapper { min-height: 220px; }
    }

    .properties-panel::-webkit-scrollbar { width: 3px; }
    .properties-panel::-webkit-scrollbar-track { background: transparent; }
    .properties-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Brand wordmark -->
  <div class="brand-wordmark"><span>Signlly</span></div>

  <!-- Bottom footer -->
  <div class="brand-footer">
    <div class="footer-created">Created by</div>
    <div class="footer-name">Farhad R. Ali</div>
    <div class="footer-copy">© <span id="footerYear"></span> <span class="copy-name">Signlly</span></div>
  </div>
  <div class="canvas-layer">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="signatureCanvas"></canvas>
      <div class="canvas-grid"></div>
      <div class="canvas-hint" id="canvasHint">Draw your signature here</div>
    </div>
  </div>

  <div class="floating-toolbar">
    <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
      <span>Undo</span>
    </button>
    <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
      <span>Redo</span>
    </button>
    <div class="toolbar-divider"></div>
    <button class="tool-btn" id="clearBtn" title="Clear canvas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      <span>Clear</span>
    </button>
    <div class="toolbar-divider"></div>
    <button class="tool-btn tool-btn--primary" id="downloadBtn" title="Download PNG">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Download PNG</span>
    </button>
  </div>

  <div class="properties-panel" id="propertiesPanel">
    <div class="panel-accent-bar"></div>
    <div class="panel-header"><h2>Customize</h2></div>

    <div class="panel-section">
      <label class="section-label">Pen Color</label>
      <div class="color-grid">
        <button class="color-swatch active" data-color="#000000" style="background:#000000" title="Black"></button>
        <button class="color-swatch" data-color="#1a3a5c" style="background:#1a3a5c" title="Navy"></button>
        <button class="color-swatch" data-color="#2563eb" style="background:#2563eb" title="Blue"></button>
        <button class="color-swatch" data-color="#dc2626" style="background:#dc2626" title="Red"></button>
        <button class="color-swatch" data-color="#16a34a" style="background:#16a34a" title="Green"></button>
        <button class="color-swatch" data-color="#7c3aed" style="background:#7c3aed" title="Purple"></button>
        <button class="color-swatch color-swatch--custom" id="customColorBtn" title="Custom color">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
      </div>
      <input type="color" id="colorPicker" style="position:absolute;visibility:hidden;pointer-events:none" value="#000000">
    </div>

    <div class="panel-divider"></div>

    <!-- Compact slider stack -->
    <div class="panel-section">
      <div class="slider-row">
        <div class="slider-label-col"><span class="section-label">Width</span></div>
        <div class="slider-track-col"><input type="range" class="slider" id="widthSlider" min="1" max="24" value="3"></div>
        <span class="slider-value" id="widthValue">3px</span>
      </div>
      <div class="slider-row">
        <div class="slider-label-col"><span class="section-label">Opacity</span></div>
        <div class="slider-track-col"><input type="range" class="slider" id="opacitySlider" min="10" max="100" value="100"></div>
        <span class="slider-value" id="opacityValue">100%</span>
      </div>
      <div class="slider-row">
        <div class="slider-label-col"><span class="section-label">Smoothing</span></div>
        <div class="slider-track-col"><input type="range" class="slider" id="smoothingSlider" min="0" max="5" value="3" step="1"></div>
        <span class="slider-value" id="smoothingValue">3</span>
      </div>
      <div class="slider-row">
        <div class="slider-label-col"><span class="section-label">Streamline</span></div>
        <div class="slider-track-col"><input type="range" class="slider" id="streamlineSlider" min="0" max="90" value="40" step="5"></div>
        <span class="slider-value" id="streamlineValue">40%</span>
      </div>
    </div>

    <div class="panel-divider"></div>

    <div class="panel-section">
      <label class="section-label">Background</label>
      <div class="bg-options">
        <button class="bg-option active" data-bg="white">
          <div class="bg-preview" style="background:#ffffff"></div><span>White</span>
        </button>
        <button class="bg-option" data-bg="transparent">
          <div class="bg-preview" style="background:repeating-conic-gradient(#ddd 0% 25%,transparent 0% 50%) 50%/10px 10px"></div><span>Transparent</span>
        </button>
        <button class="bg-option" data-bg="custom">
          <div class="bg-preview" id="customBgPreview" style="background:#fef3c7"></div><span>Custom</span>
        </button>
      </div>
      <input type="color" id="bgColorPicker" style="position:absolute;visibility:hidden;pointer-events:none" value="#fef3c7">
    </div>

    <div class="panel-divider"></div>

    <div class="panel-section">
      <div class="toggle-rows">
        <div class="toggle-row">
          <span class="section-label">Pressure sim</span>
          <label class="toggle-switch">
            <input type="checkbox" id="pressureToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="section-label">Taper ends</span>
          <label class="toggle-switch">
            <input type="checkbox" id="taperToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="panel-footer">
      <div class="signature-info">
        <span id="strokeCount">0 strokes</span>
        <span class="info-divider">·</span>
        <span id="canvasSize">—</span>
      </div>
    </div>
  </div>

  <button class="panel-toggle" id="panelToggle" aria-label="Open settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </button>

  <div id="penCursor"></div>
  <div class="toast-container" id="toastContainer"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// Settings
// ═══════════════════════════════════════════════════════════
const settings = {
  color: '#000000',
  width: 3,
  opacity: 1,
  smoothingPasses: 3,   // Chaikin subdivision passes (0–5)
  streamline: 0.40,     // EMA input filter (0–0.9)
  pressure: false,      // simulate speed-based pressure
  taper: false,         // taper stroke ends
  bgType: 'white',
  bgColor: '#fef3c7',
};

// ═══════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════
let strokes = [];
let undoneStrokes = [];
let isDrawing = false;
let rawPoints = [];      // raw pointer points during a stroke
let smoothedPoints = []; // EMA-filtered points
let lastVel = 0;
const MAX_HISTORY = 50;

// ═══════════════════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════════════════
const canvas     = document.getElementById('signatureCanvas');
const ctx        = canvas.getContext('2d', { willReadFrequently: true });
const wrapper    = document.getElementById('canvasWrapper');
const hint       = document.getElementById('canvasHint');
const panel      = document.getElementById('propertiesPanel');
const panelBtn   = document.getElementById('panelToggle');
const toastCont  = document.getElementById('toastContainer');
const strokeEl   = document.getElementById('strokeCount');
const sizeEl     = document.getElementById('canvasSize');
const penCursor  = document.getElementById('penCursor');

const undoBtn    = document.getElementById('undoBtn');
const redoBtn    = document.getElementById('redoBtn');

// ═══════════════════════════════════════════════════════════
// Canvas resize
// ═══════════════════════════════════════════════════════════
let dpr = 1;

function resizeCanvas() {
  const r = wrapper.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width  = r.width  * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width  = r.width  + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sizeEl.textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`;
  redrawAll();
}

function ptCoords(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// ═══════════════════════════════════════════════════════════
// Chaikin curve smoothing
// One pass: each edge is cut at 1/4 and 3/4 producing 2 new pts.
// Multiple passes → converges to a smooth B-spline.
// ═══════════════════════════════════════════════════════════
function chaikin(pts, passes) {
  if (passes === 0 || pts.length < 3) return pts;
  let out = [pts[0]]; // keep first point
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1];
    out.push({ x: 0.75*p0.x + 0.25*p1.x, y: 0.75*p0.y + 0.25*p1.y });
    out.push({ x: 0.25*p0.x + 0.75*p1.x, y: 0.25*p0.y + 0.75*p1.y });
  }
  out.push(pts[pts.length - 1]); // keep last point
  return chaikin(out, passes - 1);
}

// ═══════════════════════════════════════════════════════════
// Stroke rendering — variable-width with optional taper
// Draws a series of filled ellipses along the spine, varying
// radius per-point based on recorded width values.
// ═══════════════════════════════════════════════════════════
function renderStroke(stroke) {
  const pts = stroke.smoothed;
  if (!pts || pts.length < 2) return;

  const widths = stroke.widths; // per-point width (post-pressure)

  ctx.save();
  ctx.globalAlpha = stroke.opacity;
  ctx.fillStyle   = stroke.color;
  ctx.strokeStyle = stroke.color;

  // Draw filled circles along spine for variable-width feel
  for (let i = 0; i < pts.length; i++) {
    const w = widths ? widths[Math.min(i, widths.length - 1)] : stroke.width;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, w / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Connect with lines to fill gaps between circles
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';
  for (let i = 0; i < pts.length - 1; i++) {
    const w0 = widths ? widths[Math.min(i,   widths.length - 1)] : stroke.width;
    const w1 = widths ? widths[Math.min(i+1, widths.length - 1)] : stroke.width;
    const w  = (w0 + w1) / 2;
    ctx.beginPath();
    ctx.lineWidth = w;
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i+1].x, pts[i+1].y);
    ctx.stroke();
  }

  ctx.restore();
}

function redrawAll() {
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  for (const s of strokes) renderStroke(s);
}

// ═══════════════════════════════════════════════════════════
// Pressure simulation: width varies inversely with speed.
// Apply taper at start/end using a smooth ramp.
// ═══════════════════════════════════════════════════════════
function computeWidths(pts, baseWidth, usePressure, useTaper) {
  const n = pts.length;
  if (n < 2) return pts.map(() => baseWidth);

  // 1. Speed-based pressure
  const speeds = [0];
  for (let i = 1; i < n; i++) {
    const dx = pts[i].x - pts[i-1].x;
    const dy = pts[i].y - pts[i-1].y;
    speeds.push(Math.sqrt(dx*dx + dy*dy));
  }

  // Smooth speeds with a small window
  const smoothSpeeds = speeds.map((s, i) => {
    const w = [speeds[Math.max(0,i-1)], s, speeds[Math.min(n-1,i+1)]];
    return (w[0]+w[1]+w[2]) / 3;
  });

  const maxSpd = Math.max(...smoothSpeeds, 1);
  const minW = baseWidth * 0.3;
  const maxW = baseWidth * 1.6;

  const widths = smoothSpeeds.map(spd => {
    if (!usePressure) return baseWidth;
    // fast = thin, slow = thick
    const t = 1 - Math.min(spd / (maxSpd * 0.6), 1);
    return minW + t * (maxW - minW);
  });

  // 2. Taper: multiply by ramp at start and end
  if (useTaper && n > 4) {
    // Use 30% of the stroke length for each taper, min 3 pts
    const taperLen = Math.max(3, Math.floor(n * 0.30));
    for (let i = 0; i < taperLen; i++) {
      const t = i / (taperLen - 1);
      const r = t * t * (3 - 2*t); // smoothstep
      // Start taper
      widths[i] = Math.min(widths[i], widths[i] * r);
      // End taper (mirror)
      const j = n - 1 - i;
      widths[j] = Math.min(widths[j], widths[j] * r);
    }
  }

  return widths;
}

// ═══════════════════════════════════════════════════════════
// Build a complete stroke object from raw input points
// ═══════════════════════════════════════════════════════════
function buildStroke(rawPts, color, width, opacity) {
  // Apply Chaikin smoothing to the captured points
  const smoothed = chaikin(rawPts, settings.smoothingPasses);
  const widths   = computeWidths(smoothed, width, settings.pressure, settings.taper);
  return { rawPts, smoothed, widths, color, width, opacity };
}

// ═══════════════════════════════════════════════════════════
// Pointer Events
// ═══════════════════════════════════════════════════════════
let prevSmoothed = null; // EMA accumulator

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  const pt = ptCoords(e);
  rawPoints     = [pt];
  smoothedPoints = [pt];
  prevSmoothed  = pt;
  lastVel = 0;
  undoneStrokes = [];
  hint.style.opacity = '0';
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDrawing) return;
  e.preventDefault();

  const raw = ptCoords(e);

  // EMA streamline filter
  const α = settings.streamline;
  const filtered = {
    x: α * prevSmoothed.x + (1 - α) * raw.x,
    y: α * prevSmoothed.y + (1 - α) * raw.y,
  };
  prevSmoothed = filtered;
  rawPoints.push(filtered);

  // Live preview: rebuild smoothed stroke on every move
  const preview = buildStroke(rawPoints, settings.color, settings.width, settings.opacity);
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  redrawAll();
  renderStroke(preview);
});

canvas.addEventListener('pointerup',    finishStroke);
canvas.addEventListener('pointerleave', finishStroke);
canvas.addEventListener('pointercancel',finishStroke);

function finishStroke(e) {
  if (!isDrawing) return;
  isDrawing = false;

  if (rawPoints.length > 1) {
    const stroke = buildStroke(rawPoints, settings.color, settings.width, settings.opacity);
    strokes.push(stroke);
    if (strokes.length > MAX_HISTORY) strokes.shift();
    redrawAll();
    updateUndoRedo();
    updateStrokeCount();
  }
  rawPoints = [];
  smoothedPoints = [];
  prevSmoothed = null;
}

canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove',  (e) => e.preventDefault(), { passive: false });

// ═══════════════════════════════════════════════════════════
// Pen cursor preview
// ═══════════════════════════════════════════════════════════
function updateCursor(e) {
  const size = Math.max(settings.width, 4);
  penCursor.style.width  = size + 'px';
  penCursor.style.height = size + 'px';
  penCursor.style.left   = e.clientX + 'px';
  penCursor.style.top    = e.clientY + 'px';

  // Invert color against canvas bg
  if (settings.bgType === 'white') {
    penCursor.style.background = 'transparent';
    penCursor.style.border = `2px solid ${settings.color}`;
    penCursor.style.opacity = '0.7';
  } else {
    penCursor.style.background = settings.color;
    penCursor.style.border = '1.5px solid rgba(255,255,255,0.4)';
    penCursor.style.opacity = '0.6';
  }
}

window.addEventListener('pointermove', (e) => {
  penCursor.style.display = 'block';
  updateCursor(e);
});

wrapper.addEventListener('pointerenter', () => { canvas.style.cursor = 'none'; });
wrapper.addEventListener('pointerleave', () => {
  canvas.style.cursor = 'crosshair';
  penCursor.style.display = 'none';
});

// ═══════════════════════════════════════════════════════════
// Undo / Redo
// ═══════════════════════════════════════════════════════════
function updateUndoRedo() {
  undoBtn.disabled = strokes.length === 0;
  redoBtn.disabled = undoneStrokes.length === 0;
  undoBtn.style.opacity = strokes.length === 0 ? '0.35' : '1';
  redoBtn.style.opacity = undoneStrokes.length === 0 ? '0.35' : '1';
}

function undo() {
  if (!strokes.length) return;
  undoneStrokes.push(strokes.pop());
  redrawAll(); updateUndoRedo(); updateStrokeCount();
  if (!strokes.length) hint.style.opacity = '1';
}

function redo() {
  if (!undoneStrokes.length) return;
  strokes.push(undoneStrokes.pop());
  redrawAll(); updateUndoRedo(); updateStrokeCount();
  hint.style.opacity = '0';
}

function clearCanvas() {
  strokes = []; undoneStrokes = [];
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  updateUndoRedo(); updateStrokeCount();
  hint.style.opacity = '1';
  showToast('Canvas cleared', 'info');
}

function updateStrokeCount() {
  strokeEl.textContent = `${strokes.length} stroke${strokes.length !== 1 ? 's' : ''}`;
}

// ═══════════════════════════════════════════════════════════
// PNG Export  — re-renders via renderStroke, DPR-aware
// ═══════════════════════════════════════════════════════════
function downloadPNG() {
  const off = document.createElement('canvas');
  off.width  = canvas.width;
  off.height = canvas.height;
  const oc = off.getContext('2d');

  if (settings.bgType === 'white') {
    oc.fillStyle = '#ffffff';
    oc.fillRect(0, 0, off.width, off.height);
  } else if (settings.bgType === 'custom') {
    oc.fillStyle = settings.bgColor;
    oc.fillRect(0, 0, off.width, off.height);
  }

  oc.save();
  oc.scale(dpr, dpr);

  // Temporarily swap context
  const origCtx = ctx;
  // Render directly to off-screen ctx
  for (const s of strokes) {
    const pts = s.smoothed;
    if (!pts || pts.length < 2) continue;
    oc.save();
    oc.globalAlpha = s.opacity;
    oc.fillStyle   = s.color;
    oc.strokeStyle = s.color;
    for (let i = 0; i < pts.length; i++) {
      const w = s.widths ? s.widths[Math.min(i, s.widths.length-1)] : s.width;
      oc.beginPath();
      oc.arc(pts[i].x, pts[i].y, w/2, 0, Math.PI*2);
      oc.fill();
    }
    oc.lineJoin = 'round'; oc.lineCap = 'round';
    for (let i = 0; i < pts.length - 1; i++) {
      const w0 = s.widths ? s.widths[Math.min(i,   s.widths.length-1)] : s.width;
      const w1 = s.widths ? s.widths[Math.min(i+1, s.widths.length-1)] : s.width;
      oc.lineWidth = (w0+w1)/2;
      oc.beginPath();
      oc.moveTo(pts[i].x, pts[i].y);
      oc.lineTo(pts[i+1].x, pts[i+1].y);
      oc.stroke();
    }
    oc.restore();
  }
  oc.restore();

  off.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `signature-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Signature saved as PNG ✓', 'success');
  }, 'image/png');
}

// ═══════════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════════
function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast-notification toast-${type}`;
  t.textContent = msg;
  toastCont.appendChild(t);
  setTimeout(() => {
    t.classList.add('fade-out');
    t.addEventListener('animationend', () => t.remove());
  }, 2400);
}

// ═══════════════════════════════════════════════════════════
// Controls wiring
// ═══════════════════════════════════════════════════════════

// Color
const colorSwatches = document.querySelectorAll('.color-swatch[data-color]');
const customColorBtn = document.getElementById('customColorBtn');
const colorPicker    = document.getElementById('colorPicker');

function setActiveColor(color) {
  settings.color = color;
  colorSwatches.forEach(s => s.classList.toggle('active', s.dataset.color === color));
  customColorBtn.classList.remove('active');
}

colorSwatches.forEach(s => s.addEventListener('click', () => {
  setActiveColor(s.dataset.color);
  colorPicker.value = s.dataset.color;
  updateCursorStyle();
}));
customColorBtn.addEventListener('click', () => colorPicker.click());
colorPicker.addEventListener('input', () => {
  settings.color = colorPicker.value;
  colorSwatches.forEach(s => s.classList.remove('active'));
  customColorBtn.classList.add('active');
  customColorBtn.style.background = colorPicker.value;
  customColorBtn.style.color = '#fff';
  updateCursorStyle();
});

function updateCursorStyle() {
  penCursor.style.borderColor = settings.color;
}

// Sliders
const widthSlider     = document.getElementById('widthSlider');
const widthValue      = document.getElementById('widthValue');
const opacitySlider   = document.getElementById('opacitySlider');
const opacityValue    = document.getElementById('opacityValue');
const smoothSlider    = document.getElementById('smoothingSlider');
const smoothValue     = document.getElementById('smoothingValue');
const streamSlider    = document.getElementById('streamlineSlider');
const streamValue     = document.getElementById('streamlineValue');

widthSlider.addEventListener('input', () => {
  settings.width = +widthSlider.value;
  widthValue.textContent = settings.width + 'px';
  penCursor.style.width = penCursor.style.height = Math.max(settings.width, 4) + 'px';
});

opacitySlider.addEventListener('input', () => {
  settings.opacity = +opacitySlider.value / 100;
  opacityValue.textContent = opacitySlider.value + '%';
});

smoothSlider.addEventListener('input', () => {
  settings.smoothingPasses = +smoothSlider.value;
  smoothValue.textContent = smoothSlider.value;
});

streamSlider.addEventListener('input', () => {
  settings.streamline = +streamSlider.value / 100;
  streamValue.textContent = streamSlider.value + '%';
});

// Background
const bgOptions    = document.querySelectorAll('.bg-option');
const bgColorPicker = document.getElementById('bgColorPicker');
const customBgPreview = document.getElementById('customBgPreview');

function updateBg() {
  if (settings.bgType === 'white')       canvas.style.background = '#ffffff';
  else if (settings.bgType === 'transparent') canvas.style.background = 'transparent';
  else                                   canvas.style.background = settings.bgColor;
}

bgOptions.forEach(o => o.addEventListener('click', () => {
  settings.bgType = o.dataset.bg;
  bgOptions.forEach(x => x.classList.remove('active'));
  o.classList.add('active');
  if (settings.bgType === 'custom') bgColorPicker.click();
  updateBg();
}));

bgColorPicker.addEventListener('input', () => {
  settings.bgColor = bgColorPicker.value;
  customBgPreview.style.background = settings.bgColor;
  if (settings.bgType === 'custom') updateBg();
});

// Toggles
document.getElementById('pressureToggle').addEventListener('change', e => {
  settings.pressure = e.target.checked;
});
document.getElementById('taperToggle').addEventListener('change', e => {
  settings.taper = e.target.checked;
});

// Toolbar
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('clearBtn').addEventListener('click', clearCanvas);
document.getElementById('downloadBtn').addEventListener('click', downloadPNG);

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey||e.metaKey) && ((e.key==='z'&&e.shiftKey)||e.key==='y')) { e.preventDefault(); redo(); }
});

// Mobile panel
let panelOpen = false;
panelBtn.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panel.classList.toggle('panel-open', panelOpen);
  panelBtn.classList.toggle('toggle-active', panelOpen);
});
document.addEventListener('click', (e) => {
  if (panelOpen && !panel.contains(e.target) && !panelBtn.contains(e.target)) {
    panelOpen = false;
    panel.classList.remove('panel-open');
    panelBtn.classList.remove('toggle-active');
  }
});

// Resize
let resizeTid;
window.addEventListener('resize', () => {
  clearTimeout(resizeTid);
  resizeTid = setTimeout(resizeCanvas, 150);
});

// ═══════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════
resizeCanvas();
updateUndoRedo();
updateStrokeCount();
updateBg();
document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
